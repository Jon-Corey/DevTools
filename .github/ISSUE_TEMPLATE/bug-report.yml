name: Bug Report
description: Report an issue to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill out the details below so it can be reproduced and fixed. Don't include sensitive data in files or text you share here.
  - type: input
    id: tool
    attributes:
      label: Affected tool or page
      description: Which tool or page has the problem?
      placeholder: e.g. Image Converter, or https://devtools.joncorey.dev/tools/image-converter/
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Enter or select '...'
        3. Click '...'
        4. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Which browser and version were you using when the bug occurred?
      placeholder: e.g. Chrome 156, Firefox 158, Safari on iOS 27.0.1
    validations:
      required: true
  - type: textarea
    id: additional-info
    attributes:
      label: Screenshots or additional info
      description: Drag in screenshots, paste any errors from the browser console, or add any other relevant information.
    validations:
      required: false
